name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests use the MongoDB service below instead of downloading a mongod binary.
  MONGOMS_DISABLE_POSTINSTALL: '1'

jobs:
  verify:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok === 1 ? 0 : 1)'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: JavaScript only (no TypeScript)
        run: npm run check:js-only
      - run: npm run lint
      - name: Unit, integration and convergence tests
        run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok === 1 ? 0 : 1)'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Docker image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t syncspace:ci .
